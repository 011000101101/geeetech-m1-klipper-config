# Geeetech M1 start-print helper macros
#
# Evidence-backed stock wipe path:
# - The original Marlin image includes G12 nozzle-clean support.
# - Adjacent float32 data in the stock firmware decodes to:
#   start=(30.0, 112.75, 0.5)
#   end=(72.0, 112.75, 0.5)
# - That strongly suggests the stock wipe routine used a straight
#   stroke-based clean path along the Y-edge wipe strip.
#
# Reconstructed behavior:
# - The purge line below is not directly recovered from firmware.
# - It is intentionally placed to the right of the recovered wipe strip,
#   in the otherwise unused plate area.

[gcode_macro STOCK_WIPE_M1]
description: Replay the stock Marlin G12-style wipe path recovered from firmware
variable_start_x: 30.0
variable_end_x: 72.0
variable_y: 112.75
variable_z: 0.5
variable_strokes: 6  # The vendor macro used 12 strokes.
variable_travel_speed: 180
variable_wipe_speed: 80
gcode:
  {% set macro = printer["gcode_macro STOCK_WIPE_M1"] %}
  {% set start_x = params.START_X|default(macro.start_x)|float %}
  {% set end_x = params.END_X|default(macro.end_x)|float %}
  {% set y = params.Y|default(macro.y)|float %}
  {% set z = params.Z|default(macro.z)|float %}
  {% set strokes = params.STROKES|default(macro.strokes)|int %}
  {% set travel_speed = params.TRAVEL_SPEED|default(macro.travel_speed)|float %}
  {% set wipe_speed = params.WIPE_SPEED|default(macro.wipe_speed)|float %}
  {% set current_z = printer.gcode_move.gcode_position.z|float %}
  {% set safe_z = [current_z + 2.0, z + 2.0]|max %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_raise_error("STOCK_WIPE_M1 requires X/Y/Z to be homed first") }
  {% endif %}
  SAVE_GCODE_STATE NAME=STOCK_WIPE_M1_STATE
  G90
  M83
  G1 Z{"%.3f" % safe_z} F{travel_speed * 60}
  G1 X{"%.3f" % start_x} Y{"%.3f" % y} F{travel_speed * 60}
  G1 Z{"%.3f" % z} F{travel_speed * 60}
  {% for _ in range([strokes - 1, 0]|max) %}
  G1 X{"%.3f" % end_x} F{wipe_speed * 60}
  G1 X{"%.3f" % start_x} F{wipe_speed * 60}
  {% endfor %}
  {% if strokes > 0 %}
  G1 X{"%.3f" % end_x} F{wipe_speed * 60}
  {% endif %}
  G1 Z{"%.3f" % safe_z} F{travel_speed * 60}
  RESTORE_GCODE_STATE NAME=STOCK_WIPE_M1_STATE MOVE=0

[gcode_macro PURGE_LINE_M1]
description: Prime a single line to the right of the recovered stock wipe strip
variable_start_x: 75.0
variable_end_x: 100.0
variable_y: 111.50
variable_z: 0.45
variable_prime_e: 3.0
variable_line_e: 6.8
variable_travel_speed: 180
variable_purge_speed: 3  # Lowered from 6.5 mm/s to avoid Klipper's maximum volumetric extrusion limit.
variable_retract_e: 0.5
gcode:
  {% set macro = printer["gcode_macro PURGE_LINE_M1"] %}
  {% set start_x = params.START_X|default(macro.start_x)|float %}
  {% set end_x = params.END_X|default(macro.end_x)|float %}
  {% set y = params.Y|default(macro.y)|float %}
  {% set z = params.Z|default(macro.z)|float %}
  {% set prime_e = params.PRIME_E|default(macro.prime_e)|float %}
  {% set line_e = params.LINE_E|default(macro.line_e)|float %}
  {% set retract_e = params.RETRACT_E|default(macro.retract_e)|float %}
  {% set travel_speed = params.TRAVEL_SPEED|default(macro.travel_speed)|float %}
  {% set purge_speed = params.PURGE_SPEED|default(macro.purge_speed)|float %}
  {% set current_z = printer.gcode_move.gcode_position.z|float %}
  {% set safe_z = [current_z + 2.0, z + 2.0]|max %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_raise_error("PURGE_LINE_M1 requires X/Y/Z to be homed first") }
  {% endif %}
  {% if not printer.extruder.can_extrude %}
    { action_raise_error("PURGE_LINE_M1 requires the nozzle to be at extrusion temperature") }
  {% endif %}
  SAVE_GCODE_STATE NAME=PURGE_LINE_M1_STATE
  G90
  M83
  G1 Z{"%.3f" % safe_z} F{travel_speed * 60}
  G1 X{"%.3f" % start_x} Y{"%.3f" % y} F{travel_speed * 60}
  G1 Z{"%.3f" % z} F{travel_speed * 60}
  G1 E{"%.3f" % prime_e} F180
  G1 X{"%.3f" % end_x} E{"%.3f" % line_e} F{purge_speed * 60}
  G1 E-{"%.3f" % retract_e} F1200
  RESTORE_GCODE_STATE NAME=PURGE_LINE_M1_STATE MOVE=0

[gcode_macro WIPE_AND_PURGE_M1]
description: Stock-style wipe followed by an adjacent purge line
gcode:
  STOCK_WIPE_M1
  PURGE_LINE_M1

[gcode_macro PARK_AT_PURGE_START_M1]
description: Move to the purge line start and seat the nozzle to limit ooze before probing
variable_travel_speed: 180
variable_plug_z: 0.0
gcode:
  {% set purge = printer["gcode_macro PURGE_LINE_M1"] %}
  {% set travel_speed = params.TRAVEL_SPEED|default(printer["gcode_macro PARK_AT_PURGE_START_M1"].travel_speed)|float %}
  {% set plug_z = params.PLUG_Z|default(printer["gcode_macro PARK_AT_PURGE_START_M1"].plug_z)|float %}
  {% set current_z = printer.gcode_move.gcode_position.z|float %}
  {% set safe_z = [current_z + 2.0, plug_z + 2.0]|max %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_raise_error("PARK_AT_PURGE_START_M1 requires X/Y/Z to be homed first") }
  {% endif %}
  G90
  M83
  G1 Z{"%.3f" % safe_z} F{travel_speed * 60}
  G1 X{"%.3f" % purge.start_x} Y{"%.3f" % purge.y} F{travel_speed * 60}
  G1 Z{"%.3f" % plug_z} F{travel_speed * 60}

[gcode_macro START_PRINT]
description: Heat, clean hot nozzle, cool for probing, adaptive-mesh, then purge for print
variable_adaptive_margin: 3.0
variable_travel_z: 3.0
variable_probe_temp: 140.0
gcode:
  {% set bed_temp = params.BED_TEMP|default(60)|float %}
  {% set extruder_temp = params.EXTRUDER_TEMP|default(200)|float %}
  {% set macro = printer["gcode_macro START_PRINT"] %}
  {% set adaptive_margin = params.ADAPTIVE_MARGIN|default(macro.adaptive_margin)|float %}
  {% set travel_z = params.TRAVEL_Z|default(macro.travel_z)|float %}
  {% set probe_temp = params.PROBE_TEMP|default(macro.probe_temp)|float %}
  SET_DISPLAY_TEXT MSG="Start: preheating"
  M140 S{bed_temp}
  M104 S{extruder_temp}
  M220 S100
  M221 S100
  G90
  M83
  G92 E0
  SET_DISPLAY_TEXT MSG="Start: homing"
  G28
  SET_DISPLAY_TEXT MSG="Start: hot nozzle cleanup"
  M109 S{extruder_temp}
  M104 S{probe_temp}
  M107
  STOCK_WIPE_M1
  SET_DISPLAY_TEXT MSG="Start: cooling for mesh"
  PARK_AT_PURGE_START_M1
  SET_DISPLAY_TEXT MSG="Start: waiting for bed"
  M190 S{bed_temp}
  M109 S{probe_temp}
  G1 Z{travel_z} F1800
  SET_DISPLAY_TEXT MSG="Start: adaptive mesh"
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={adaptive_margin}
  SET_DISPLAY_TEXT MSG="Start: reheating nozzle"
  M109 S{extruder_temp}
  SET_DISPLAY_TEXT MSG="Start: purge line"
  PURGE_LINE_M1
  G92 E0
  SET_DISPLAY_TEXT MSG="Start: printing"

[gcode_macro END_PRINT]
description: Retract while moving right, park, clear mesh, and shut down heaters
variable_park_x: 114.0
variable_park_y: 113.0  # Y maximum moves the bed forward to present the print.
variable_travel_speed: 120
variable_retract_e: 0.6
variable_lift_z: 3.0
gcode:
  {% set macro = printer["gcode_macro END_PRINT"] %}
  {% set park_x = params.PARK_X|default(macro.park_x)|float %}
  {% set park_y = params.PARK_Y|default(macro.park_y)|float %}
  {% set travel_speed = params.TRAVEL_SPEED|default(macro.travel_speed)|float %}
  {% set retract_e = params.RETRACT_E|default(macro.retract_e)|float %}
  {% set lift_z = params.LIFT_Z|default(macro.lift_z)|float %}
  M400
  G92 E0
  G90
  M83
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set current_z = printer.gcode_move.gcode_position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set park_z = [current_z + lift_z, max_z]|min %}
    G1 X{"%.3f" % park_x} E-{"%.3f" % retract_e} F{travel_speed * 60}
    G1 Z{"%.3f" % park_z} F{travel_speed * 60}
    G1 X{"%.3f" % park_x} Y{"%.3f" % park_y} F{travel_speed * 60}
  {% endif %}
  TURN_OFF_HEATERS
  M107
  BED_MESH_CLEAR
  G92 E0

[gcode_macro PAUSE]
description: Retract, lift, and park at the safe-home corner
rename_existing: BASE_PAUSE
variable_park_x: 114.0
variable_park_y: 5.0
variable_travel_speed: 120
variable_retract_e: 2.0
variable_lift_z: 3.0
gcode:
  {% set macro = printer["gcode_macro PAUSE"] %}
  {% set park_x = params.PARK_X|default(macro.park_x)|float %}
  {% set park_y = params.PARK_Y|default(macro.park_y)|float %}
  {% set travel_speed = params.TRAVEL_SPEED|default(macro.travel_speed)|float %}
  {% set retract_e = params.RETRACT_E|default(macro.retract_e)|float %}
  {% set lift_z = params.LIFT_Z|default(macro.lift_z)|float %}
  BASE_PAUSE
  G92 E0
  G90
  M83
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set current_z = printer.gcode_move.gcode_position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set park_z = [current_z + lift_z, max_z]|min %}
    G1 X{"%.3f" % park_x} E-{"%.3f" % retract_e} F{travel_speed * 60}
    G1 Z{"%.3f" % park_z} F{travel_speed * 60}
    G1 X{"%.3f" % park_x} Y{"%.3f" % park_y} F{travel_speed * 60}
  {% endif %}

[gcode_macro RESUME]
description: Re-prime after pause and continue the print
rename_existing: BASE_RESUME
variable_recover_e: 2.3
gcode:
  {% set recover_e = params.RECOVER_E|default(printer["gcode_macro RESUME"].recover_e)|float %}
  M83
  G1 E{"%.3f" % recover_e} F300
  BASE_RESUME

[gcode_macro CANCEL_PRINT]
description: Cancel the print, park safely, and shut down heaters
rename_existing: BASE_CANCEL_PRINT
gcode:
  END_PRINT
  CLEAR_PAUSE
  SDCARD_RESET_FILE
  BASE_CANCEL_PRINT

[gcode_macro LOADCELL_ZERO]
description: Reset the daughterboard load-cell probe baseline
gcode:
  M400
  G4 P50
  # Match the stock-firmware PB5 strobe: active-high for about 25 ms, then low.
  SET_PIN PIN=_loadcell_zero VALUE=1
  G4 P25
  SET_PIN PIN=_loadcell_zero VALUE=0
  G4 P10
